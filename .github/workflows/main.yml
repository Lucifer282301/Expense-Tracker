name: Build & Deploy

on:
  push:
    branches:
      - PROD

permissions:
  contents: write

env:
  CI: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repo
      - name: Checkout repo
        uses: actions/checkout@v4

      # 2. Setup Node.js 22
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 3. Cache frontend dependencies
      - name: Cache frontend dependencies
        uses: actions/cache@v3
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-frontend-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-frontend-

      # 4. Install frontend dependencies
      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # 5. Build frontend project
      - name: Build project
        working-directory: frontend
        run: npm run build

      # 6. Upload production-ready build files
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: production-files
          path: frontend/dist       # <-- Vite default output folder
          if-no-files-found: error

  deploy_backend:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Trigger backend deploy on Render
        run: |
          curl -X POST \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{}' \
            https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys

  deploy_frontend:
    needs: [build, deploy_backend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/PROD'

    steps:
      # 1. Download build artifact
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: production-files
          path: ./dist

      # 2. Deploy to GitHub Pages
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist       # <-- must match downloaded artifact folder
